name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch latest yt-dlp bundle into res/raw
        run: curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o app/src/main/res/raw/ytdlp || true

      - name: Run unit tests and assemble Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yt-downloader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
